<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Homelab</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0b0f0c; color: #c8f7c5; overflow: hidden; height: 100vh;
    font-family: "DejaVu Sans Mono", Consolas, monospace;
  }
  /* The Car Thing knob covers the right edge: keep everything clear of it. */
  .app { display: flex; flex-direction: column; height: 100vh; position: relative; }
  .top { flex: 1; min-height: 0; display: flex; padding: 12px 84px 0 18px; }
  .head { display: flex; flex-shrink: 0; }
  .head .foot { margin: 0 0 0 auto; }
  .log { flex: 1; font-size: 16px; line-height: 1.5; white-space: pre; overflow: hidden; min-width: 0;
    display: flex; flex-direction: column; }
  .viewport { flex: 1; position: relative; overflow: hidden; min-height: 0; }
  #scroller { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
  .gap { height: 24px; }
  /* stopped / failing services: pinned on top and highlighted */
  .pin { margin: 1px 0; padding-left: 6px; border-left: 4px solid; }
  .pin-bad { background: rgba(240,144,130,.18); border-color: #F09082; }
  .pin-bad .line, .pin-bad .line span { color: #ffb3a6; font-weight: 700; }
  .pin-warn { background: rgba(241,190,88,.12); border-color: #F1BE58; }
  #pinned:not(:empty) { margin: 3px 0 5px; }
  .hd, .dim { color: #5c6b5a; }
  .ok { color: #6ee7a0; }
  .warn { color: #F1BE58; }
  .bad { color: #F09082; }
  .line { overflow: hidden; text-overflow: ellipsis; }
  .foot { flex-shrink: 0; }

  /* the maid walks along this floor strip, across the whole screen */
  .mascot { height: 82px; flex-shrink: 0; position: relative; overflow: hidden;
    border-top: 1px solid rgba(110,231,160,.08); }
  #actor { position: absolute; left: 0; bottom: 0; will-change: transform; }
  #actor img { position: absolute; left: 0; bottom: 0; display: block; }

  /* ---------- trouble: glitch ---------- */
  .trouble .app { background: radial-gradient(circle at 80% 70%, #2a0f1e 0%, #0b0f0c 65%); }
  .trouble .tag-bad { animation: gtext 1.1s steps(1) infinite; }
  @keyframes gtext {
    0%, 100% { text-shadow: 2px 0 rgba(255,40,100,.9), -2px 0 rgba(0,230,255,.9); }
    25% { text-shadow: -3px 0 rgba(255,40,100,.9), 3px 0 rgba(0,230,255,.9); }
    55% { text-shadow: 4px 0 rgba(255,40,100,.9), -4px 0 rgba(0,230,255,.9); }
    80% { text-shadow: none; }
  }
  .glitching #actor .main { animation: gjit .42s steps(1) infinite;
    filter: drop-shadow(3px 0 0 rgba(255,40,100,.85)) drop-shadow(-3px 0 0 rgba(0,230,255,.85)); }
  @keyframes gjit {
    0% { transform: none; opacity: 1; }
    15% { transform: translate(-3px, 1px) skewX(4deg); }
    30% { transform: translate(2px, 0); opacity: .75; }
    45% { transform: none; opacity: 1; }
    70% { transform: translate(4px, -1px) skewX(-6deg); }
    85% { transform: translate(-1px, 0); opacity: .6; }
  }
  #actor .slice { display: none; pointer-events: none; }
  .glitching #actor .slice { display: block; }
  .slice.s1 { filter: sepia(1) saturate(8) hue-rotate(300deg); opacity: .85; }
  .slice.s2 { filter: sepia(1) saturate(8) hue-rotate(140deg); opacity: .85; }
  .scan { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0, rgba(0,0,0,.28) 2px, transparent 2px, transparent 4px);
    animation: flicker 2.3s steps(1) infinite; }
  .trouble .scan { display: block; }
  @keyframes flicker { 0%, 100% { opacity: .5; } 48% { opacity: .85; } 52% { opacity: .2; } 75% { opacity: .65; } }

  /* new alert: a short, strong burst over the whole screen */
  .shock .app { animation: shock .12s steps(1) 8; }
  @keyframes shock {
    0% { transform: translate(6px, 0); filter: hue-rotate(90deg); }
    50% { transform: translate(-6px, 2px) skewX(3deg); filter: invert(1); }
    100% { transform: none; filter: none; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div id="log" class="log">
        <div class="head"><span class="hd">$ komodo status --watch</span><span id="foot" class="foot"></span></div>
        <div id="pinned"></div>
        <div id="viewport" class="viewport"><div id="scroller"><div class="dim">collegamento…</div></div></div>
      </div>
    </div>
    <div id="mascot" class="mascot">
      <div id="actor">
        <img class="main" id="frame" src="mascot/walk_r0.png" alt="" />
        <img class="slice s1" src="mascot/walk_r0.png" alt="" />
        <img class="slice s2" src="mascot/walk_r0.png" alt="" />
      </div>
    </div>
  </div>
  <div class="scan"></div>
  <script src="./main.js"></script>
</body>
</html>
